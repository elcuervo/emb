# The sandbox's emb server configuration.
#
# emb listens on loopback only: the bridge is the single public surface and the
# only party that speaks to it, so no credential ever reaches a browser and a
# misconfigured public route cannot reach the server.
#
# Models live on the mounted volume (`/data`), so the first boot downloads once
# and every later boot loads from disk. Model names match the site's copy.
#
# The request caps bound one command's inference work; the bridge bounds the
# rate, the concurrency, and the total work.

listen: "127.0.0.1:6379"

# The demo repeats itself — the site ships fixed example commands and a visitor
# runs one more than once — and every repeat without a cache re-runs inference
# on one shared vCPU. 64 MB holds ~43k cached vectors, and the bridge's own work
# ceiling (20,000 texts per window) can produce only ~29 MB of them, so the
# budget never binds. It is written out rather than `auto` because `auto` (13%
# of RAM) would claim far more on this machine than the demo can ever use, and
# the budget that matters here is the volume the snapshot writes, not RAM.
cache: 64MB

# The warm cache lives on the volume beside the models, so a restart reloads it
# instead of starting cold. `cache_load` and `cache_save_on_shutdown` already
# default to true, so naming the file is the whole change; it is written 0600,
# holds the demo's own input text, and is disposable — deleting it is always
# safe. A graceful stop flushes it; the interval is the backstop for a restart
# that never got a signal. The path is a file directly under `/data` because the
# mount root exists and the snapshot writer does not create directories.
cache_file: /data/cache.embcache
cache_save: 30m

max_texts: 8
max_pairs: 8
max_command_bytes: 1048576

# The image surface is enabled for one demo and bounded before decode: at most
# two images per command, a quarter of a megabyte each on the wire, and one
# megapixel of decoded pixels. The bridge enforces the same counts (see
# `Limits.MaxImages`/`MaxImageBytes`), and only the preloaded image preset may
# carry a binary argument at all.
max_images: 2
max_image_bytes: 262144
max_image_pixels: 1048576

# The volume paths carry `int8/` on purpose. `downloadModel` returns early when
# the configured `onnx` file exists, and the volume already holds the fp32
# weights; naming an unwritten path is what makes the first boot after this
# change fetch the pre-quantized weights rather than silently keeping fp32.
# See openspec/changes/website-demos-gallery/design.md (D3).
#
# `max_length` is 512 on the passage-level models: the gallery's atlas embeds
# Poe paragraphs, and the previous 256 truncated them. sst2 classifies one
# sentence, so it keeps 256.
models:
  minilm:
    model_repo: Xenova/all-MiniLM-L6-v2
    # The bridge serializes upstream work over one connection, so extra embedding
    # workers cannot run concurrently here -- and on Linux the batch-determinism
    # probe fails for these exports, degrading each pool to `workers` sessions and
    # multiplying the resident weights. One worker per model keeps the sandbox in
    # its memory budget.
    workers: 1
    onnx: /data/models/int8/minilm/model.onnx
    tokenizer: /data/models/int8/minilm/tokenizer.json
    max_length: 512
    # Xenova repos ship onnx/model_quantized.onnx; `auto` prefers it and falls
    # back to fp32. ~4x less resident weight memory and a smaller first boot.
    quantize: auto
    # Sentence-transformers semantics: the pooled vector must be L2-normalized,
    # or `emb.embed`'s documented norm of 1 and cosine similarity are wrong.
    normalize: true
    scripts:
      - presets/embed.lua
      - presets/rank.lua
      - presets/between.lua
      - presets/graph.lua

  sst2:
    model_repo: Xenova/distilbert-base-uncased-finetuned-sst-2-english
    workers: 1
    onnx: /data/models/int8/sst2/model.onnx
    tokenizer: /data/models/int8/sst2/tokenizer.json
    max_length: 256
    quantize: auto
    scripts:
      - presets/classify.lua

  # The model lens: same 384 dimensions as minilm, a different space. The
  # gallery's whole argument is that these two are not interchangeable.
  bge-small:
    model_repo: Xenova/bge-small-en-v1.5
    workers: 1
    onnx: /data/models/int8/bge-small/model.onnx
    tokenizer: /data/models/int8/bge-small/tokenizer.json
    max_length: 512
    quantize: auto
    normalize: true
    scripts:
      - presets/embed.lua

  # Retrieval-tuned, 50+ languages: a query in one language answering with a
  # passage in another.
  multilingual:
    model_repo: Xenova/paraphrase-multilingual-MiniLM-L12-v2
    workers: 1
    onnx: /data/models/int8/multilingual/model.onnx
    tokenizer: /data/models/int8/multilingual/tokenizer.json
    max_length: 512
    quantize: auto
    normalize: true
    scripts:
      - presets/embed.lua

  # The one vision model: a fused CLIP export whose text and image branches
  # share a space. It is scripted (`emb.run` over the named tensors) because the
  # fused graph demands both branches' inputs for either run, so the text-only
  # `EMB` path cannot feed it directly. `image:` enables `emb.image.preprocess`
  # and the raw `EMB.IMG` surface; the sandbox exposes the latter to no demo, so
  # `EMB.IMG` stays outside the surface while the preset runs the same sessions.
  clip:
    model_repo: Xenova/clip-vit-base-patch32
    workers: 1
    onnx: /data/models/int8/clip/model.onnx
    tokenizer: /data/models/int8/clip/tokenizer.json
    max_length: 77
    quantize: auto
    script_preload: true
    script_workers: 1
    image:
      input: pixel_values
      output: image_embeds
      size: 224
      crop: center
      resample: bicubic
      rescale: 0.00392156862745098
      mean: [0.48145466, 0.4578275, 0.40821073]
      std: [0.26862954, 0.26130258, 0.27577711]
    scripts:
      - presets/zeroshot.lua

  # The decision model: a 32-hidden miniature of the Laya architecture shipped
  # inside the image (testdata/laya) rather than downloaded. Its weights are
  # random, so the decision plate runs the real mechanism and answers nothing
  # real -- the prose and the figure say so, and the docs point at the
  # published checkpoints for production. Three presets: the generic decision
  # preset (laya.lua, questions as data) and two task presets (snake.lua and
  # pacman.lua, each owning its own loop and returning a whole episode per call).
  # The checkpoint envelope lives on the entries' scripts config, so a client
  # sends only state + questions.
  laya:
    onnx: /etc/emb/laya-model/model.onnx
    tokenizer: /etc/emb/laya-model/tokenizer/tokenizer.json
    workers: 1
    script_preload: true
    scripts:
      - path: presets/laya.lua
        config:
          max_len: 64
          head_max_len: 32
          min_seq: 8
          min_markers: 2
          temperature: [1.6, 1.25, 1.98]
          temperature_by_options:
            "choice:2": 1.9
            "choice:3-5": 1.76
            "choice:11+": 0.1006
            "noul:2": 1.98
      - path: presets/snake.lua
        config:
          max_len: 64
          head_max_len: 32
          min_seq: 8
          min_markers: 2
          temperature: [1.6, 1.25, 1.98]
          temperature_by_options:
            "choice:2": 1.9
            "choice:3-5": 1.76
            "choice:11+": 0.1006
            "noul:2": 1.98
      - path: presets/pacman.lua
        config:
          max_len: 64
          head_max_len: 32
          min_seq: 8
          min_markers: 2
          temperature: [1.6, 1.25, 1.98]
          temperature_by_options:
            "choice:2": 1.9
            "choice:3-5": 1.76
            "choice:11+": 0.1006
            "noul:2": 1.98

  # The real decision model: the published `typed-decisions` export
  # (ModernBERT-large, fp16 on the hub), mounted from its subfolder in the
  # repository and downloaded once onto the volume. The plate's typed-question
  # examples (Inbox, Quickstart) answer with this checkpoint; the game loops stay
  # on the miniature, because a ~400M model cannot keep a 96-tick episode
  # realtime on one shared vCPU. `max_length` and the scripts' envelope come from
  # the export's own `rl_agent_config.json` / `onnx_config.json`, so the preset's
  # sequence construction matches the reference. typed-decisions is the
  # fine-tuned customer-service / security / invoice export: the `multilingual`
  # router export ships with identity temperatures and no fitted calibration, and
  # marked legitimate mail as spam/phishing (see design D1). See
  # openspec/changes/laya-real-checkpoint/design.md (D1, D5).
  laya-real:
    model_repo: codenamev/laya-onnx
    model_subfolder: typed-decisions
    # `laya-typed/`, not `laya-real/`: `downloadModel` returns early when the
    # configured `onnx` exists, and the volume already holds the previous
    # (`multilingual`) checkpoint at `laya-real/`. Naming a fresh path is what
    # makes the first boot after this change fetch the new export.
    onnx: /data/models/laya-typed/model.onnx
    tokenizer: /data/models/laya-typed/tokenizer.json
    max_length: 1024
    workers: 1
    # Intra-op threads matter here and inter-op threads do not: the graph is a
    # chain with two outputs, so the only parallelism is within one request's
    # matmuls. The bridge serializes upstream work, which means requests do not
    # overlap — it does not mean a single request cannot use the cores. Four
    # threads on the four-vCPU machine (~4x the one-thread rate) with the one
    # worker the serialized bridge can use.
    intra_op_threads: 4
    inter_op_threads: 1
    script_preload: true
    scripts:
      - path: presets/laya.lua
        config:
          max_len: 1024
          head_max_len: 256
          min_seq: 8
          min_markers: 2
          temperature: [1.0148024559020996, 1.0374259948730469, 1.0575125217437744]
          temperature_by_options:
            "choice:2": 1.9063563346862793
            "choice:3-5": 1.7601518630981445
            "choice:6-10": 1.0000158548355103
            "choice:11+": 0.10058280825614929
            "score:3-5": 1.2514300346374512
            "noul:2": 1.983399510383606
        warm:
          # The plate's fixed payloads, mirrored from website/demos/laya.html:
          # the Quickstart round first, then the Inbox tickets in the page's own
          # order, so the payloads a visitor is likeliest to open are cached before
          # the warm can yield to traffic. A state or question edited on the page
          # without editing here is a cache miss, never a wrong answer.
          - args:
              - '{"department":{"type":"choice","instructions":"Which department should handle this email?","criteria":{"billing":"invoices, payments, refunds","technical":"bugs, outages, system errors","sales":"pricing, new contracts","other":"everything else"}},"urgency":{"type":"score","instructions":"How urgent is this request?","criteria":["not urgent","soon","critical deadline or blocking issue"]},"refund":{"type":"noul","instructions":"Does the customer ask for money back?"}}'
            texts:
              - '{"from": "user@example.com", "subject": "Duplicate charge on invoice #4411", "body": "We were billed twice for March. Please refund the duplicate today or we will cancel our plan."}'
          - args:
              - '{"category":{"type":"choice","instructions":"Which team should handle the email in `body`?","criteria":{"billing":"invoices, payments, refunds","technical":"bugs, outages, integrations","sales":"pricing, demos, new purchases","security":"phishing, scams, account compromise","hr":"hiring, leave, payroll","other":"none of the above"}},"is_spam":{"type":"noul","instructions":"Is this email unsolicited spam or bulk marketing?"},"is_phishing":{"type":"noul","instructions":"Is this email a phishing or scam attempt to steal money, credentials, or personal data?","criteria":{"true":"phishing, scam, or fraud","false":"a legitimate email"}},"urgency":{"type":"score","instructions":"How urgent is the request in `body`?","criteria":["no time pressure","needs attention soon","blocking issue or hard deadline"]},"needs_reply":{"type":"noul","instructions":"Does the sender expect a reply?"}}'
            texts:
              - '{"from": "hello@world", "subject": "duplicate charge on invoice", "body": "we were charged twice for the invoice please refund the money back today"}'
              - '{"from": "b.winters@example.com", "subject": "refund my first month", "body": "please refund the first month or i am cancelling today"}'
              - '{"from": "ops@startup.io", "subject": "prod cluster down after deploy", "body": "after the latest deploy our production cluster returns 502 for every request and customers are leaving"}'
              - '{"from": "buyer@corp.com", "subject": "pricing for fifty seats", "body": "we are evaluating you against two vendors, can you send enterprise pricing for fifty seats and a demo this week"}'
              - '{"from": "security@verification.example", "subject": "confirm your password", "body": "your account was locked, send the password to unlock it immediately"}'
              - '{"from": "user@gmail.com", "subject": "someone logged into my account", "body": "i got a login alert from a country i have never visited and my account looks compromised, please help"}'
              - '{"from": "ana@company.com", "subject": "missing march payslip", "body": "my march payslip never arrived and the payroll portal shows nothing, i have a mortgage due friday"}'
              - '{"from": "cliente@ejemplo.com", "subject": "nos cobraron dos veces", "body": "se nos cobraron dos veces la factura de marzo, pedimos el reembolso hoy"}'
