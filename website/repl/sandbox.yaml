# The sandbox's emb server configuration.
#
# emb listens on loopback only: the bridge is the single public surface and the
# only party that speaks to it, so no credential ever reaches a browser and a
# misconfigured public route cannot reach the server.
#
# Models live on the mounted volume (`/data`), so the first boot downloads once
# and every later boot loads from disk. Model names match the site's copy.
#
# The request caps bound one command's inference work; the bridge bounds the
# rate, the concurrency, and the total work.

listen: "127.0.0.1:6379"

# The demo repeats itself — the site ships fixed example commands and a visitor
# runs one more than once — and every repeat without a cache re-runs inference
# on one shared vCPU. 64 MB holds ~43k cached vectors, and the bridge's own work
# ceiling (20,000 texts per window) can produce only ~29 MB of them, so the
# budget never binds. It is written out rather than `auto` because this machine
# is 1.92 GiB with ~0.45 GiB free once both models are warm, and `auto` (13% of
# RAM) would claim 268 MB of that. No cache_file: this is a sandbox, so a
# restart may start cold and nothing is written to the volume.
cache: 64MB

max_texts: 8
max_pairs: 8
max_command_bytes: 1048576

# The image surface is enabled for one demo and bounded before decode: at most
# two images per command, a quarter of a megabyte each on the wire, and one
# megapixel of decoded pixels. The bridge enforces the same counts (see
# `Limits.MaxImages`/`MaxImageBytes`), and only the preloaded image preset may
# carry a binary argument at all.
max_images: 2
max_image_bytes: 262144
max_image_pixels: 1048576

# The volume paths carry `int8/` on purpose. `downloadModel` returns early when
# the configured `onnx` file exists, and the volume already holds the fp32
# weights; naming an unwritten path is what makes the first boot after this
# change fetch the pre-quantized weights rather than silently keeping fp32.
# See openspec/changes/website-demos-gallery/design.md (D3).
#
# `max_length` is 512 on the passage-level models: the gallery's atlas embeds
# Poe paragraphs, and the previous 256 truncated them. sst2 classifies one
# sentence, so it keeps 256.
models:
  minilm:
    model_repo: Xenova/all-MiniLM-L6-v2
    onnx: /data/models/int8/minilm/model.onnx
    tokenizer: /data/models/int8/minilm/tokenizer.json
    max_length: 512
    # Xenova repos ship onnx/model_quantized.onnx; `auto` prefers it and falls
    # back to fp32. ~4x less resident weight memory and a smaller first boot.
    quantize: auto
    # Sentence-transformers semantics: the pooled vector must be L2-normalized,
    # or `emb.embed`'s documented norm of 1 and cosine similarity are wrong.
    normalize: true
    scripts:
      - presets/embed.lua
      - presets/rank.lua
      - presets/between.lua
      - presets/graph.lua

  sst2:
    model_repo: Xenova/distilbert-base-uncased-finetuned-sst-2-english
    onnx: /data/models/int8/sst2/model.onnx
    tokenizer: /data/models/int8/sst2/tokenizer.json
    max_length: 256
    quantize: auto
    scripts:
      - presets/classify.lua

  # The model lens: same 384 dimensions as minilm, a different space. The
  # gallery's whole argument is that these two are not interchangeable.
  bge-small:
    model_repo: Xenova/bge-small-en-v1.5
    onnx: /data/models/int8/bge-small/model.onnx
    tokenizer: /data/models/int8/bge-small/tokenizer.json
    max_length: 512
    quantize: auto
    normalize: true
    scripts:
      - presets/embed.lua

  # Retrieval-tuned, 50+ languages: a query in one language answering with a
  # passage in another.
  multilingual:
    model_repo: Xenova/paraphrase-multilingual-MiniLM-L12-v2
    onnx: /data/models/int8/multilingual/model.onnx
    tokenizer: /data/models/int8/multilingual/tokenizer.json
    max_length: 512
    quantize: auto
    normalize: true
    scripts:
      - presets/embed.lua

  # The one vision model: a fused CLIP export whose text and image branches
  # share a space. It is scripted (`emb.run` over the named tensors) because the
  # fused graph demands both branches' inputs for either run, so the text-only
  # `EMB` path cannot feed it directly. `image:` enables `emb.image.preprocess`
  # and the raw `EMB.IMG` surface; the sandbox exposes the latter to no demo, so
  # `EMB.IMG` stays outside the surface while the preset runs the same sessions.
  clip:
    model_repo: Xenova/clip-vit-base-patch32
    onnx: /data/models/int8/clip/model.onnx
    tokenizer: /data/models/int8/clip/tokenizer.json
    max_length: 77
    quantize: auto
    script_preload: true
    script_workers: 1
    image:
      input: pixel_values
      output: image_embeds
      size: 224
      crop: center
      resample: bicubic
      rescale: 0.00392156862745098
      mean: [0.48145466, 0.4578275, 0.40821073]
      std: [0.26862954, 0.26130258, 0.27577711]
    scripts:
      - presets/zeroshot.lua
