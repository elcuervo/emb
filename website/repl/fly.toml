# Fly configuration for the sandbox: one machine, one volume, two processes
# (emb on loopback, the bridge public) behind one entrypoint.
#
# Deploy from the repository root, because the image build needs the Go module.
# The positional `.` is the build context (the repository root); `dockerfile`
# below is resolved against *this file's* directory, not against that context:
#
#     fly deploy . -c website/repl/fly.toml
#
# or via `just sandbox-deploy`. The app name and region are the deployment's
# own; the hostname cli.emb.is is attached to the app afterwards.

app = "emb-sandbox"
primary_region = "iad"

# Graceful exit must outlast the server's own shutdown, which allows up to 30s to
# drain and flush the cache to the volume. Fly's default is 5s, which would
# SIGKILL a machine mid-flush; run.sh already traps the signal (the default
# SIGINT, and SIGTERM) and waits for the server, so only the ceiling changes.
# This is a ceiling, not a delay: a healthy stop still exits in about a second.
kill_timeout = 40

[build]
  dockerfile = "Dockerfile"

[env]
  EMB_CONFIG = "/etc/emb/sandbox.yaml"
  BRIDGE_LISTEN = "0.0.0.0:8080"
  UPSTREAM = "127.0.0.1:6379"
  ORIGINS = "https://emb.is,https://www.emb.is"
  # The real `laya-real` checkpoint is a large fp16 export and ONNX Runtime's
  # load path materializes it more than once (the input/output metadata probes
  # each open a temporary session before the real one). On a multithreaded glibc
  # that can strand several freed ~1.2 GiB blocks in per-thread arenas and OOM
  # the machine mid-load. Collapsing the arena count keeps the freed blocks
  # reusable; `GOMEMLIMIT` does the same for the Go-side model buffers. The
  # model's own intra-op thread count is set per entry in sandbox.yaml; no
  # process-wide thread cap is set here, so the checkpoint can use the machine's
  # cores. See fly.toml's `[[vm]]` note and design D4.
  MALLOC_ARENA_MAX = "1"
  GOMEMLIMIT = "2GiB"

[http_service]
  internal_port = 8080
  force_https = true
  # The machine stays running. Cost was accepted in exchange for removing the
  # cold-start path, the wake-and-retry client state, and the proxy-timeout
  # cliff on the first model download. The work ceiling, not autostop, is the
  # cost ceiling.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  # Fly caps a check's grace period at one minute, so asking for more only
  # produces a warning. The first boot downloads any model the volume lacks and
  # then loads all of them before the server answers, which takes minutes: the
  # check passes again once it does. `/api/ready` answers 503 while the server is
  # starting or gone, so a check that stays down is a boot that never finished
  # rather than a healthy machine OOM-restarting behind a passing check.
  grace_period = "60s"
  method = "GET"
  path = "/api/ready"

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "30s"
  method = "GET"
  path = "/api/health"

[[vm]]
  # Sized from the measured set, not a guess. Resident memory is set by what the
  # CPU execution provider materializes, not by the file on disk: it expands the
  # weights to fp32 and keeps the dequantized copies, so a graph costs roughly
  # 3-6x its file once its first call has run (docs/configuration.md). The real
  # `typed-decisions` checkpoint dominates: as the 806 MB fp16 export the first
  # deployment mounted it cost ~4.9 GB resident, which OOM-killed this machine in
  # a loop once the media models were resident beside it; as the int8 export the
  # sandbox mounts now it measures ~2.3 GB (sandbox.yaml's `laya-real` entry).
  #
  # `workers: 1` is pinned in sandbox.yaml (the bridge serializes upstream work
  # anyway), and on Linux the batch-determinism probe fails for these exports, so
  # each pool would otherwise degrade to `workers` sessions and multiply the
  # resident weights. 8 GB holds the int8 set with headroom; it requires
  # `shared-cpu-4x` because shared CPU memory is capped at 2 GB per CPU. Re-check
  # the resident set before adding a model, and re-measure if one changes.
  size = "shared-cpu-4x"
  memory = "8gb"

[mounts]
  # Models download onto the volume on the first boot and load from disk after
  # that; the server config names /data/models/<name>/model.onnx.
  source = "emb_sandbox_data"
  destination = "/data"
  # The media-models deploy (CLAP int8 + X-CLIP fp32, ~914 MB) overflowed the
  # original 3 GB volume mid-download, which the server treats as fatal and
  # crash-looped the machine until its health checks timed out. A fresh deploy
  # needs 6. `initial_size` only applies when the volume is created; the live
  # volume was extended in place with `fly volumes extend`.
  initial_size = "6GB"
