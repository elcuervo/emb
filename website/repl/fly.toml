# Fly configuration for the sandbox: one machine, one volume, two processes
# (emb on loopback, the bridge public) behind one entrypoint.
#
# Deploy from the repository root, because the image build needs the Go module.
# The positional `.` is the build context (the repository root); `dockerfile`
# below is resolved against *this file's* directory, not against that context:
#
#     fly deploy . -c website/repl/fly.toml
#
# or via `just sandbox-deploy`. The app name and region are the deployment's
# own; the hostname cli.emb.is is attached to the app afterwards.

app = "emb-sandbox"
primary_region = "iad"

# Graceful exit must outlast the server's own shutdown, which allows up to 30s to
# drain and flush the cache to the volume. Fly's default is 5s, which would
# SIGKILL a machine mid-flush; run.sh already traps the signal (the default
# SIGINT, and SIGTERM) and waits for the server, so only the ceiling changes.
# This is a ceiling, not a delay: a healthy stop still exits in about a second.
kill_timeout = 40

[build]
  dockerfile = "Dockerfile"

[env]
  EMB_CONFIG = "/etc/emb/sandbox.yaml"
  BRIDGE_LISTEN = "0.0.0.0:8080"
  UPSTREAM = "127.0.0.1:6379"
  ORIGINS = "https://emb.is,https://www.emb.is"
  # The real `laya-real` checkpoint is a large fp16 export and ONNX Runtime's
  # load path materializes it more than once (the input/output metadata probes
  # each open a temporary session before the real one). On a multithreaded glibc
  # that can strand several freed ~1.2 GiB blocks in per-thread arenas and OOM
  # the machine mid-load. Collapsing the arena count keeps the freed blocks
  # reusable; `GOMEMLIMIT` does the same for the Go-side model buffers. The
  # model's own intra-op thread count is set per entry in sandbox.yaml; no
  # process-wide thread cap is set here, so the checkpoint can use the machine's
  # cores. See fly.toml's `[[vm]]` note and design D4.
  MALLOC_ARENA_MAX = "1"
  GOMEMLIMIT = "2GiB"

[http_service]
  internal_port = 8080
  force_https = true
  # The machine stays running. Cost was accepted in exchange for removing the
  # cold-start path, the wake-and-retry client state, and the proxy-timeout
  # cliff on the first model download. The work ceiling, not autostop, is the
  # cost ceiling.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  # Fly caps a check's grace period at one minute, so asking for more only
  # produces a warning. The first boot downloads both models onto the volume
  # before /api/ready turns true; if that ever exceeds a minute, raise the
  # volume or ship the models in the image rather than this number.
  grace_period = "60s"
  method = "GET"
  path = "/api/ready"

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "30s"
  method = "GET"
  path = "/api/health"

[[vm]]
  # Sized from the measured set, not a guess. The real `typed-decisions` Laya
  # checkpoint dominates: ONNX Runtime materializes its ~807 MiB fp16 weights as
  # fp32, so each session holds ~1.6 GiB. The first landing ran 4 GB and
  # OOM-killed `emb` during the `laya-real` load: on Linux the batch-determinism
  # probe fails for these exports, so each pool degraded to `workers`
  # auto-tuned sessions, and the checkpoint was loaded once per worker.
  # `workers: 1` is now pinned in sandbox.yaml (the bridge serializes upstream
  # work anyway), which brings the footprint back to one embedding session plus
  # the scripted session. 8 GB leaves headroom; it requires `shared-cpu-4x`
  # because shared CPU memory is capped at 2 GB per CPU. The cheaper path is
  # producing and hosting an int8 export (design D4), which would fit a far
  # smaller machine. Re-measure if the model set changes.
  size = "shared-cpu-4x"
  memory = "8gb"

[mounts]
  # Models download onto the volume on the first boot and load from disk after
  # that; the server config names /data/models/<name>/model.onnx.
  source = "emb_sandbox_data"
  destination = "/data"
