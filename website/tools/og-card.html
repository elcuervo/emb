<!doctype html>
<!-- og-card.html — the locked source of assets/img/og.png (1200×630).
     A standalone composition from brand tokens, NOT a screenshot of the
     landing page: nav items, numbers and sections come and go, the card
     must not rot with them.

     The card is the page's one-sentence thesis, compressed: the small `emb`
     wordmark in the masthead, and the orange signal dripping from the
     masthead's rule down onto the massif, where it forks across the ridge. It
     replaces an earlier card whose mid band was the giant wordmark; the giant
     word lives on the landing, the massif is what this card leads with.
     Nothing sits between the rule and the rock: one band of chrome, then the
     artwork.

     The massif, the fold axis and the route are derived from the same
     constants and the same formulas the landing uses, so the two surfaces
     cannot drift apart:
       fold = pad + .6531 × (1200 - 2 × pad)          → the spine's x
       art-w = 1.005 × max(card, fold/fork, (card-fold)/(1-fork))
       art   left = fold - fork × art-w               → the fork lands on the spine
     The artwork covers the card edge to edge (its own crop never enters the
     frame) and the route shares the art box, so the line is glued to the rock.

     Regenerate: serve website/ (`just website`), then
       agent-browser open http://localhost:8080/tools/og-card.html
       agent-browser set viewport 1200 630
       agent-browser eval "document.fonts.ready.then(()=>1)" (wait)
       agent-browser screenshot website/assets/img/og.png
     The capture must be exactly 1200×630. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face{
    font-family: "Inter";
    src: url("../assets/fonts/inter-900-latin.woff2") format("woff2");
    font-weight: 100 900; font-style: normal; font-display: swap;
  }
  @font-face{
    font-family: "Archivo";
    src: url("../assets/fonts/archivo-var-latin.woff2") format("woff2");
    font-weight: 100 900; font-style: normal; font-display: swap;
  }
  @font-face{
    font-family: "JetBrains Mono";
    src: url("../assets/fonts/jetbrains-mono-var-latin.woff2") format("woff2");
    font-weight: 100 800; font-style: normal; font-display: swap;
  }
  :root{
    /* the landing's tokens, at card scale */
    --paper: #F3F0E8; --ink: #0B0B0B;
    --accent: #FF5A1F;          /* surface only: the line */
    --accent-ink: #C23D00;      /* 4.66:1 on paper: text */
    --rule: #B8B5AC;
    --pad: 48px;

    /* the page's derived axis, resolved for a 1200-wide card (see the head) */
    --fold-n: .6531;
    --fold-x: calc(var(--pad) + var(--fold-n) * (1200px - 2 * var(--pad)));
    --fork: .6417706;
    --fork-rest: .3582294;
    --art-ratio: .3546;
    --art-w: calc(1.005 * max(1200px,
      var(--fold-x) / var(--fork),
      (1200px - var(--fold-x)) / var(--fork-rest)));
    --art-h: calc(var(--art-w) * var(--art-ratio));
    /* one weight for the CSS segment and the route: the stroke is drawn with
       vector-effect, so it does not scale with the stretched viewBox */
    --spine-w: 5px;
  }
  *{ margin: 0; padding: 0; box-sizing: border-box; }
  html, body{ width: 1200px; height: 630px; }
  body{
    background: var(--paper); color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden; position: relative;
    -webkit-font-smoothing: antialiased;
    font-synthesis-weight: none;
  }

  /* ── the masthead, then the massif ───────────────────────────────── */
  .top{
    height: 88px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 var(--pad);
    border-bottom: 2px solid var(--ink);
  }
  .top__brand{ display: flex; align-items: center; gap: 20px; }
  .word{ font-family: "Inter", "Archivo", sans-serif; font-weight: 900;
    font-size: 48px; letter-spacing: -.04em; line-height: 1; }
  .vrule{ width: 1px; height: 30px; background: var(--rule); }
  .tag{ font-family: "JetBrains Mono", monospace; font-size: 15px;
    font-weight: 500; letter-spacing: .18em; line-height: 1.5; }
  .top__meta{ font-family: "JetBrains Mono", monospace; font-size: 14px;
    font-weight: 600; letter-spacing: .14em; text-align: right; line-height: 1.9; }

  /* ── the massif ──────────────────────────────────────────────────── */
  /* the band is the whole card below the masthead, and it is taller than the
     artwork: the extra is sky, the same way the landing's --band outgrows
     --art-h above the massif on a narrow screen. Nothing is restated here. */
  .massif{ position: relative; height: 542px; overflow: hidden; }
  /* the drip: from the masthead's rule down to where the artwork begins, so the
     CSS segment hands over to the route's own trunk with no gap and no step */
  .spine{
    position: absolute; top: 0; bottom: var(--art-h);
    left: calc(var(--fold-x) - var(--spine-w) / 2);
    width: var(--spine-w); background: var(--accent);
  }
  .art{
    position: absolute; bottom: 0;
    left: calc(var(--fold-x) - var(--fork) * var(--art-w));
    width: var(--art-w); aspect-ratio: 2172 / 770.2;
  }
  .art__photo{
    position: absolute; inset: auto 0 0 0;
    width: 100%; height: 94%; object-fit: fill; display: block;
  }
  .art__route{
    position: absolute; inset: 0; width: 100%; height: 100%;
    color: var(--accent);
  }
  .route{ fill: none; stroke: currentColor; stroke-width: var(--spine-w);
    stroke-linecap: square; stroke-linejoin: miter; }
  /* the 269.64-unit nudge puts the fork on the ridge crest above the spine */
  .art__route path{ transform: translateX(269.64px); }

  /* the sky above the massif's left slope. The measure keeps every line's ink
     inside the paper: the rock's silhouette is still ~100px below the last
     line where it ends, so nothing here needs a knockout. */
  .massif__text{ position: absolute; left: var(--pad); top: 52px; width: 500px; }
  .claim{
    font-family: "Archivo", sans-serif; font-weight: 750;
    font-size: 48px; line-height: .98; letter-spacing: -.005em;
  }
  .claim span{ display: block; }
  /* --accent-ink, never --accent: #FF5A1F is 2.74:1 on paper and a surface
     colour only, so it cannot carry the one line of this size */
  .claim em{ font-style: normal; color: var(--accent-ink); }
  .domain{
    display: inline-block; margin-top: 30px;
    font-family: "JetBrains Mono", monospace; font-size: 16px;
    font-weight: 600; letter-spacing: .14em;
    border: 2px solid var(--ink); padding: 9px 15px;
  }
</style>
</head>
<body>
  <header class="top">
    <div class="top__brand">
      <span class="word">emb</span>
      <span class="vrule"></span>
      <span class="tag">BYTES IN.<br>VECTORS OUT.</span>
    </div>
    <p class="top__meta">REDIS PROTOCOL<br>ONNX RUNTIME</p>
  </header>

  <div class="massif">
    <span class="spine" aria-hidden="true"></span>

    <div class="massif__text">
      <p class="claim">
        <span>A fast embedding</span>
        <span>server that speaks</span>
        <span>the <em>Redis protocol.</em></span>
      </p>
      <p class="domain">emb.is</p>
    </div>

    <!-- The cut-out and the route share one box, anchored by its left edge so
         the fork lands on the spine by construction. -->
    <div class="art">
      <img class="art__photo" src="../assets/img/terrain-matte.png"
           width="2172" height="722" alt="">
      <svg class="art__route" viewBox="0 0 2172 770.2" preserveAspectRatio="none"
           aria-hidden="true" focusable="false">
        <path class="route" vector-effect="non-scaling-stroke"
          d="M1124.3 0 L1124.3 243.5 L1056.9 288.8 L995 337 L930.4 379.4 L865.7 399.3 L820.7 419.1 L772.9 470 L739.2 504 L680.2 552.2 L632.4 574.8 L573.4 597.5 L514.3 645.6 L438.4 705.1 L320.4 744.7 L236 770.2"/>
        <path class="route" vector-effect="non-scaling-stroke"
          d="M1124.3 243.5 L1177.7 274.7 L1217.1 274.7 L1262.1 305.8 L1278.9 337 L1298.6 359.6 L1312.7 399.3 L1354.8 453.1 L1385.8 467.2 L1433.6 504 L1537.6 557.8 L1664.1 606 L1796.2 659.8 L1970.5 739.1 L2094.2 770.2"/>
      </svg>
    </div>
  </div>
</body>
</html>
