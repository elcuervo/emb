listen: ":6379"

# password: "hunter2"
# tls_cert: /etc/emb/cert.pem
# tls_key:  /etc/emb/key.pem
# cache: "auto"   # auto ≈ 13% of RAM (safety-adjusted, no byte cap), or "1GB", "256MB", "25%". Empty = disabled

# Connection lifecycle (idle_timeout defaults to 15m; explicit 0 disables it.
# Caps default to 0 = unlimited.)
# idle_timeout: 15m             # close connections idle this long (0 = never)
# max_connections: 100          # refuse new connections beyond this (0 = unlimited)
# max_concurrent_requests: 32   # busy-error EMB requests beyond this (0 = unlimited)

# Request size limits (default 4096; 0 = unlimited). Oversized EMB/EMB.MULTI
# commands are truncated: the first N items are processed, overflow reply slots
# are null. Live-tunable via CONFIG SET max_texts/max_pairs.
# max_texts: 4096               # max texts processed per EMB command
# max_pairs: 4096               # max pairs processed per EMB.MULTI command

# Image/command payload limits (live-tunable via CONFIG SET). A command whose
# buffered bytes exceed max_command_bytes is rejected before decode/inference,
# and an oversized declared bulk is refused before its payload is read.
# max_command_bytes: 64MB       # 0 = unlimited
# max_images: 4096              # images per EMB.IMG/EMB.IMGMULTI (0 = unlimited)
# max_image_bytes: 32MB         # per-image byte cap (0 = unlimited)
# max_image_pixels: 33554432    # decoded pixels per image, checked from the header first

models:
  # Standard sentence-transformers model - 3D output, mean pooling
  minilm:
    onnx: ./models/minilm/model.onnx

  # Pre-pooled model (e.g., siglip2 text encoder) - 2D output, skip mean pooling.
  # The actual export names its output "text_embeds" (768-dim); if you set an
  # output_tensor not in the graph the server falls back to the detected output
  # and logs which name it auto-selected.
  # siglip2:
  #   onnx: ./models/siglip2/text_model_int8.onnx
  #   output_tensor: text_embeds
  #   pooling: none
  #   normalize: true
  #   dim: 768
  #   max_length: 64

  # Another pre-pooled example (custom e5 export with pooling/output layers
  # baked into the graph; normalize: false -> pure buffer export).
  # e5:
  #   onnx: ./models/e5/model.onnx
  #   output_tensor: pooled_sentence_embeddings_debiased_normalized
  #   pooling: none
  #   normalize: false

  # Dual-encoder vision model: enables EMB.IMG/EMB.IMGMULTI. Text EMB and image
  # EMB.IMG share one embedding space; the dimensions of the text output and the
  # image output must match (the server fails load otherwise). Fields omitted
  # from `image:` are auto-detected from preprocessor_config.json and the ONNX
  # graph. See the README's "Image models and preprocessing parity" section.
  # clip:
  #   onnx: ./models/clip/vision_model.onnx
  #   tokenizer: ./models/clip/tokenizer.json
  #   output_tensor: text_embeds
  #   pooling: none
  #   normalize: true
  #   dim: 512
  #   image:
  #     input: pixel_values
  #     output: image_embeds
  #     size: 224
  #     crop: center
  #     resample: bicubic
  #     rescale: 0.00392156862745098
  #     mean: [0.48145466, 0.4578275, 0.40821073]
  #     std:  [0.26862954, 0.26130258, 0.27577711]
  #   image_preload: true
