<svg viewBox="0 0 880 640" xmlns="http://www.w3.org/2000/svg" width="100%" role="img" aria-labelledby="ttl desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <title id="ttl">Batch dispatch: packing, serial vs parallel, fail-closed</title>
  <desc id="desc">A flush first packs items into slices. Texts are accumulated with a running count per slice until adding the next item would exceed the chunk size, which is the client's own batch_size or the global default of 512 texts; an item bigger than a whole chunk goes into a slice by itself and the server truncates it with null slots, exactly as the eager path does. Keeping a running count instead of re-summing the slice for every item is what keeps packing linear rather than quadratic. From there the two lazy modes diverge. On the serial path, lazy multi, the slices are dispatched one after another, a single share in flight at a time: each slice is shaped into wire arguments, sent, and its reply entries mapped back onto the items in deferral order. On the parallel path, lazy batch, the number of workers is the slice count clamped to the client's connection capacity, which is the sum of its pool sizes; each worker takes an indexed slice off a shared queue and records either an ok outcome or an error outcome, and workers never touch a loader. Only the forcing thread resolves loaders, walking the outcomes in index order and remembering the first error, so the ordering matches MGET semantics even when the shares ran concurrently. Both paths funnel a Redis error into one failure tail: the pending queue is dropped, the attempt count is the retry budget plus one only for errors redis-client actually re-dispatches — connection errors and protocol errors, never read timeouts or the gem's own short-reply error — and the caller gets Emb::ServerError naming the models and the text count, with the original error preserved as its cause. Anything that is not a Redis error is treated as a local bug and re-raised unchanged after the pending set is dropped. The VALUES format has its own resolution: a single-model slice replies with one envelope whose rows are re-sliced per item, a mixed-model slice gets one envelope per pair with nil for failures, and a reply shorter than expected raises ShortReplyError, which is terminal and counted as a single attempt.</desc>
  <style>
    :root {
      --bg: #ffffff; --surface: #f6f8fa; --surface-2: #eaeef2; --border: #d0d7de;
      --text-bright: #1f2328; --text: #424a53; --text-muted: #656d76;
      --accent: #0f7a5a; --accent-2: #0757ba; --accent-3: #8a4b00; --accent-4: #5b32b0;
      --err: #b35900;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --surface: #161b22; --surface-2: #21262d; --border: #30363d;
        --text-bright: #f0f6fc; --text: #c9d1d9; --text-muted: #8b949e;
        --accent: #56d4a4; --accent-2: #58a6ff; --accent-3: #ffa657; --accent-4: #d2a8ff;
        --err: #ffa198;
      }
    }
    .dgm-flow { stroke-dasharray: 5 5; animation: dgm-flowdash 1.1s linear infinite; }
    .dgm-ants { stroke-dasharray: 5 5; animation: dgm-antsdash 2.2s linear infinite; }
    .dgm-gate { animation: dgm-lit 4s ease-in-out infinite; }
    .dgm-g2 { animation-delay: .35s; }
    .dgm-g3 { animation-delay: .7s; }
    .dgm-g4 { animation-delay: 1.05s; }
    .dgm-g5 { animation-delay: 1.4s; }
    @keyframes dgm-flowdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-antsdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-lit {
      0%, 100% { stroke: var(--border); }
      10%, 22% { stroke: var(--accent); }
      40% { stroke: var(--border); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dgm-flow, .dgm-ants, .dgm-gate { animation: none; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-2)"/>
    </marker>
    <marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-4)"/>
    </marker>
    <marker id="arE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--err)"/>
    </marker>
  </defs>

  <rect width="880" height="640" rx="10" fill="var(--bg)"/>
  <rect x="0.5" y="0.5" width="879" height="639" rx="10" fill="none" stroke="var(--border)"/>

  <text x="440" y="20" text-anchor="middle" font-size="10" fill="var(--text-muted)" letter-spacing="1">EMB GEM &#183; BATCH DISPATCH, PACKING AND THE FAIL-CLOSED TAIL</text>

  <rect x="30" y="34" width="820" height="136" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="44" y="54" font-size="9" fill="var(--text-muted)" letter-spacing="1">1 &#183; PACKING &#8212; chunk = client.batch_size || Emb.configuration.batch_size (512)</text>

  <rect x="50" y="64" width="110" height="24" rx="5" fill="var(--surface-2)" stroke="var(--border)"/>
  <text x="105" y="80" text-anchor="middle" font-size="9" fill="var(--text)">t1 &#183; 3 texts</text>
  <rect x="170" y="64" width="110" height="24" rx="5" fill="var(--surface-2)" stroke="var(--border)"/>
  <text x="225" y="80" text-anchor="middle" font-size="9" fill="var(--text)">t2 &#183; 5 texts</text>
  <rect x="290" y="64" width="120" height="24" rx="5" fill="var(--surface-2)" stroke="var(--err)"/>
  <text x="350" y="80" text-anchor="middle" font-size="9" fill="var(--err)">t3 &#183; 700 texts</text>
  <rect x="420" y="64" width="110" height="24" rx="5" fill="var(--surface-2)" stroke="var(--border)"/>
  <text x="475" y="80" text-anchor="middle" font-size="9" fill="var(--text)">t4 &#183; 2 texts</text>
  <rect x="540" y="64" width="110" height="24" rx="5" fill="var(--surface-2)" stroke="var(--border)"/>
  <text x="595" y="80" text-anchor="middle" font-size="9" fill="var(--text)">t5 &#183; 4 texts</text>
  <rect x="660" y="64" width="110" height="24" rx="5" fill="var(--surface-2)" stroke="var(--border)"/>
  <text x="715" y="80" text-anchor="middle" font-size="9" fill="var(--text)">t6 &#183; 1 text</text>

  <rect x="50" y="98" width="230" height="22" rx="5" fill="none" stroke="var(--accent-2)"/>
  <text x="165" y="113" text-anchor="middle" font-size="9" fill="var(--accent-2)">slice 1 &#183; 8 texts &#8594; EMB minilm ...</text>
  <rect x="290" y="98" width="120" height="22" rx="5" fill="none" stroke="var(--err)"/>
  <text x="350" y="113" text-anchor="middle" font-size="9" fill="var(--err)">slice 2 &#183; alone</text>
  <rect x="420" y="98" width="350" height="22" rx="5" fill="none" stroke="var(--accent-2)"/>
  <text x="595" y="113" text-anchor="middle" font-size="9" fill="var(--accent-2)">slice 3 &#183; 7 texts (models differ &#8594; EMB.MULTI)</text>

  <text x="50" y="140" font-size="9" fill="var(--text-muted)">a running text count is kept per slice — re-summing it for every item would make packing O(n&#178;)</text>
  <text x="50" y="156" font-size="9" fill="var(--text-muted)">an item larger than a whole chunk goes into a slice alone; the server answers it with null slots, exactly as eagerly</text>

  <rect x="30" y="182" width="400" height="238" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="44" y="202" font-size="9" fill="var(--text-muted)" letter-spacing="1">2a &#183; SERIAL &#8212; lazy: :multi</text>

  <rect x="50" y="212" width="360" height="34" rx="6" fill="var(--surface-2)" stroke="var(--border)"/>
  <text x="230" y="233" text-anchor="middle" font-size="10" fill="var(--text-bright)">slices.each</text>
  <line class="dgm-flow" x1="230" y1="246" x2="230" y2="256" stroke="var(--accent-4)" marker-end="url(#arP)"/>
  <rect x="50" y="258" width="360" height="34" rx="6" fill="var(--surface-2)" stroke="var(--border)"/>
  <text x="230" y="279" text-anchor="middle" font-size="10" fill="var(--text-bright)">dispatch_slice(client, slice)</text>
  <line class="dgm-flow" x1="230" y1="292" x2="230" y2="302" stroke="var(--accent-4)" marker-end="url(#arP)"/>
  <rect x="50" y="304" width="360" height="34" rx="6" fill="var(--surface-2)" stroke="var(--border)"/>
  <text x="230" y="325" text-anchor="middle" font-size="10" fill="var(--text-bright)">resolve_slice(loader, slice, reply)</text>

  <text x="50" y="356" font-size="9" fill="var(--text-muted)">one share in flight at a time; this loop repeats per slice</text>
  <text x="50" y="374" font-size="9" fill="var(--err)">Redis error &#8594; fail_batch! (fail closed)</text>
  <text x="50" y="390" font-size="9" fill="var(--text-muted)">any other error &#8594; drop pending, re-raise as a bug</text>
  <text x="50" y="406" font-size="9" fill="var(--text-muted)">values slices resolve through ValuesBatch instead</text>

  <rect x="450" y="182" width="400" height="238" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="464" y="202" font-size="9" fill="var(--text-muted)" letter-spacing="1">2b &#183; PARALLEL &#8212; lazy: :batch</text>

  <rect x="470" y="212" width="360" height="34" rx="6" fill="var(--surface-2)" stroke="var(--border)"/>
  <text x="650" y="233" text-anchor="middle" font-size="10" fill="var(--text-bright)">workers = slices.size.clamp(1, capacity)</text>
  <line class="dgm-flow" x1="650" y1="246" x2="650" y2="256" stroke="var(--accent-2)" marker-end="url(#arB)"/>
  <rect x="470" y="258" width="360" height="34" rx="6" fill="var(--surface-2)" stroke="var(--border)"/>
  <text x="650" y="279" text-anchor="middle" font-size="10" fill="var(--text-bright)">capacity = &#931; pool sizes</text>
  <line class="dgm-flow" x1="650" y1="292" x2="650" y2="302" stroke="var(--accent-2)" marker-end="url(#arB)"/>
  <rect x="470" y="304" width="360" height="34" rx="6" fill="var(--surface-2)" stroke="var(--border)"/>
  <text x="650" y="325" text-anchor="middle" font-size="10" fill="var(--text-bright)">threads pop [index, slice] off a shared queue</text>

  <text x="470" y="356" font-size="9" fill="var(--text-muted)">each worker records [:ok, slice, reply] or [:error, ...]</text>
  <text x="470" y="374" font-size="9" fill="var(--accent-2)">workers never touch a loader</text>
  <text x="470" y="390" font-size="9" fill="var(--text-muted)">the forcing thread resolves outcomes in index order</text>
  <text x="470" y="406" font-size="9" fill="var(--text-muted)">so ordering still matches MGET, concurrently or not</text>

  <rect x="30" y="432" width="520" height="148" rx="8" fill="var(--surface-2)" stroke="var(--border)"/>
  <text x="290" y="454" text-anchor="middle" font-size="10" fill="var(--err)">fail_batch! &#8212; the single failure tail</text>
  <text x="46" y="476" font-size="9" fill="var(--text-muted)">clear_batch_pending! drops the queue batch-loader would keep</text>
  <text x="46" y="492" font-size="9" fill="var(--text-muted)">transient = ConnectionError (not a read timeout)</text>
  <text x="46" y="508" font-size="9" fill="var(--text-muted)">          = ProtocolError (not ShortReplyError)</text>
  <text x="46" y="524" font-size="9" fill="var(--text-muted)">attempts = retry budget + 1 for transient, else 1</text>
  <text x="46" y="540" font-size="9" fill="var(--text-muted)">raised inside a rescue, so error.cause is preserved</text>
  <text x="46" y="562" font-size="9" fill="var(--accent-3)">callers see Emb::ServerError with models and text count</text>

  <rect x="570" y="432" width="280" height="148" rx="8" fill="var(--surface-2)" stroke="var(--border)"/>
  <text x="710" y="454" text-anchor="middle" font-size="10" fill="var(--text-bright)">the :values branch</text>
  <text x="584" y="476" font-size="9" fill="var(--text-muted)">one model &#8594; one envelope;</text>
  <text x="584" y="492" font-size="9" fill="var(--text-muted)">its rows are re-sliced per item</text>
  <text x="584" y="508" font-size="9" fill="var(--text-muted)">mixed models &#8594; one envelope</text>
  <text x="584" y="524" font-size="9" fill="var(--text-muted)">per pair, nil where one failed</text>
  <text x="584" y="540" font-size="9" fill="var(--text-muted)">RESP3 maps are rehydrated to</text>
  <text x="584" y="556" font-size="9" fill="var(--text-muted)">a Hash before parsing</text>
  <text x="584" y="574" font-size="9" fill="var(--err)">a short reply &#8594; ShortReplyError</text>

  <text x="30" y="606" font-size="9" fill="var(--text-muted)">ShortReplyError is a local protocol violation: the reply came back short on a single send, so nothing was re-sent and it counts one attempt</text>
  <text x="30" y="622" font-size="9" fill="var(--text-muted)">reconnect_attempts applies only to what redis-client itself re-dispatches — and every re-send duplicates inference, because EMB.MULTI is not idempotent</text>
</svg>
