# Laya testbed: a Laya decision checkpoint served through the scripted-model
# path (EMB.EVAL / EMB.EVSHA), using the vendored 32-hidden tiny export from
# ruby-laya's parity fixtures (see testdata/laya/README.md).
#
# The script handles everything the gem does: build_sequence, marker
# accounting, per-bucket temperature calibration, softmax/confidence and
# answer assembly. A production deployment points onnx/tokenizer at a real
# export from codenamev/laya-onnx (download + config values first — see the
# README's "Laya decision models" section) instead of testdata.
#
# Run:  nix develop
#       ./bin/emb -config test-laya.yaml -listen :16379
#       EMSHA=$(redis-cli -p 16379 EMB.SCRIPT LOAD laya-tiny "$(cat scripts/laya.lua)")  # preloaded at boot; or read sha
#       redis-cli -p 16379 EMB.EVSHA laya-tiny "{\"body\": \"refund me today\"}" \
#         '{"refund": {"type": "noul", "instructions": "does the message ask for money back"}}' \
#         '{"max_len": 64, "head_max_len": 32, "temperature": [1.6, 1.25, 1.98],
#           "temperature_by_options": {"choice:2": 1.9, "choice:3-5": 1.76,
#                                      "choice:11+": 0.5, "noul:2": 1.98}}'

listen: :16379

models:
  laya-tiny:
    onnx: ./testdata/laya/model.onnx
    tokenizer: ./testdata/laya/tokenizer/tokenizer.json
    script_preload: true
    scripts:
      - ./scripts/laya.lua