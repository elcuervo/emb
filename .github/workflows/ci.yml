name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Decides whether the Go and gem suites have anything to check. A diff
  # confined to `website/` cannot change the server, the tokenizer, or the
  # gems, so `lint`, `test`, and `gem-rails` are skipped for it — the site's own
  # gates still run, in the `site` job below and again in `site.yml`.
  #
  # Job-level `if` rather than a workflow-level `paths-ignore`: a workflow that
  # path filtering skips leaves its checks in `Pending`, which blocks a merge
  # that requires them, while a job skipped by a condition reports success.
  # https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The classifier diffs two revisions, so it needs their merge base —
          # not just the tip this event checked out.
          fetch-depth: 0

      - name: Classify the diff
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          zero=0000000000000000000000000000000000000000

          if [ "$EVENT" = "pull_request" ]; then
            # Three-dot against the pull request's own head, so the comparison is
            # the branch's work and not whatever landed on the base meanwhile.
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$BEFORE"
            head="$SHA"
          fi

          # A new branch or a forced push reports an all-zero `before` and a
          # dispatch reports none at all. Both mean there is no base to diff
          # against, so run everything rather than skip on a guess.
          if [ -z "$base" ] || [ "$base" = "$zero" ] || [ -z "$head" ]; then
            echo "No base revision to diff against; running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = "pull_request" ]; then
            range="$base...$head"
          else
            range="$base..$head"
          fi

          if ! changed=$(git diff --name-only "$range"); then
            echo "::warning::Could not diff $range; running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Changed files:\n%s\n' "${changed:-<none>}"

          # An empty diff is an empty commit: nothing to check. Anything outside
          # `website/` means the suites run.
          if [ -n "$changed" ] && printf '%s\n' "$changed" | grep -qv '^website/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Install libtokenizers
        run: |
          sudo mkdir -p /opt/libtokenizers
          curl -fsSL "https://github.com/daulet/tokenizers/releases/download/v1.27.0/libtokenizers.linux-x86_64.tar.gz" \
            -o /tmp/libtokenizers.tgz
          sudo tar xzf /tmp/libtokenizers.tgz -C /opt/libtokenizers
          rm /tmp/libtokenizers.tgz

      - name: Format check
        run: |
          test -z "$(gofmt -l .)" || { echo "Run 'gofmt -s -w .' to fix formatting"; exit 1; }

      - name: Vet
        run: go vet ./internal/config/... ./internal/hfhub/...
        env:
          CGO_ENABLED: "0"

      - name: Vet (CGo)
        run: go vet ./internal/tokenizer/...
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: "-L/opt/libtokenizers"

      - name: Test
        run: go test -short ./internal/config/... ./internal/hfhub/... ./internal/resp/... ./internal/embverify/... ./cmd/emb-verify/ ./cmd/emb-multi-verify/
        env:
          CGO_ENABLED: "0"

      - name: Test (CGo)
        run: go test -short ./internal/tokenizer/...
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: "-L/opt/libtokenizers"

  # The product site's gates. No Go, no ONNX, no browser, no network: three
  # static assertions over `website/` that were previously never run by CI at
  # all, which is how an `emb-top` capture shipped `v0.4.0` against a
  # `0.4.0.pre4` VERSION without anything going red.
  #
  # The ink check is deliberately NOT here. It measures 24 widths in Chrome
  # against a served site, so it belongs on a machine with a dev shell and a
  # browser — a green `site` job must never be read as "the ink check passed".
  # Run it by hand after a layout change:
  #
  #     just website                                        # in one shell
  #     just website-ink                                    # the landing
  #     just website-ink http://localhost:8080 docs         # the docs surface
  #     just website-ink http://localhost:8080 404          # the not-found page
  #
  # The scripts are invoked directly rather than through `just`, because the
  # runner has python3 and installing `just` to wrap two one-line recipes would
  # add a toolchain to this job for no check it does not already do.
  #
  # This job is the one thing that always runs: it is seconds of work, and
  # `VERSION` reaches the pages as well as the binary, so the stamp check is
  # worth doing for a server change too.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version stamps match VERSION
        run: python3 website/tools/stamp-version.py --check

      - name: Served tree, canonical origin, and cache rules
        run: python3 website/tools/published-tree.py

  # Real-Rails Railtie boot suite for the emb gem. `rake spec:rails` boots a
  # minimal Rails app and asserts middleware behavior against the real
  # ActionDispatch::MiddlewareStack, so it needs no emb server and no Go
  # toolchain. One job per supported Rails line on the dev-shell Ruby.
  gem-rails:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rails: ["~> 7.2.0", "~> 8.0"]
    env:
      RAILS_VERSION: ${{ matrix.rails }}
      BUNDLE_FROZEN: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install gems
        working-directory: gems/emb
        run: bundle install

      - name: Run Rails boot suite
        working-directory: gems/emb
        run: bundle exec rake spec:rails

  # STAGED (manual trigger): Fargate-shaped harness noise gate on an ARM64 runner.
  # Builds the linux/arm64 image, runs a short baseline twice, and asserts the
  # per-cell noise tolerance (req/s >= -5%, p50 <= +10%). Enable once the harness
  # is stable locally — keep it workflow_dispatch to avoid flakiness on every push.
  fargate-bench:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Download benchmark model
        run: nix develop -c just download-model

      - name: Build image + run 1 (short baseline)
        run: nix develop -c go run ./bench/fargate -mode run -cpus 2 -clients "1,8" -pipeline 1 -count 200

      - name: Run 2 (short baseline, reuse image)
        run: nix develop -c go run ./bench/fargate -mode run -cpus 2 -clients "1,8" -pipeline 1 -count 200 -skip-build true

      - name: Noise gate (req/s >= -5%, p50 <= +10%)
        run: |
          A=$(ls bench/fargate/out/run.*.json | head -1)
          B=$(ls bench/fargate/out/run.*.json | tail -1)
          nix develop -c go run ./bench/fargate -mode diff -before "$A" -after "$B"
