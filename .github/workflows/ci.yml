name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Install libtokenizers
        run: |
          sudo mkdir -p /opt/libtokenizers
          curl -fsSL "https://github.com/daulet/tokenizers/releases/download/v1.27.0/libtokenizers.linux-x86_64.tar.gz" \
            -o /tmp/libtokenizers.tgz
          sudo tar xzf /tmp/libtokenizers.tgz -C /opt/libtokenizers
          rm /tmp/libtokenizers.tgz

      - name: Format check
        run: |
          test -z "$(gofmt -l .)" || { echo "Run 'gofmt -s -w .' to fix formatting"; exit 1; }

      - name: Vet
        run: go vet ./internal/config/... ./internal/hfhub/...
        env:
          CGO_ENABLED: "0"

      - name: Vet (CGo)
        run: go vet ./internal/tokenizer/...
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: "-L/opt/libtokenizers"

      - name: Test
        run: go test -short ./internal/config/... ./internal/hfhub/...
        env:
          CGO_ENABLED: "0"

      - name: Test (CGo)
        run: go test -short ./internal/tokenizer/...
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: "-L/opt/libtokenizers"

  # STAGED (manual trigger): Fargate-shaped harness noise gate on an ARM64 runner.
  # Builds the linux/arm64 image, runs a short baseline twice, and asserts the
  # per-cell noise tolerance (req/s >= -5%, p50 <= +10%). Enable once the harness
  # is stable locally — keep it workflow_dispatch to avoid flakiness on every push.
  fargate-bench:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Download benchmark model
        run: nix develop -c just download-model

      - name: Build image + run 1 (short baseline)
        run: nix develop -c go run ./bench/fargate -mode run -cpus 2 -clients "1,8" -pipeline 1 -count 200

      - name: Run 2 (short baseline, reuse image)
        run: nix develop -c go run ./bench/fargate -mode run -cpus 2 -clients "1,8" -pipeline 1 -count 200 -skip-build true

      - name: Noise gate (req/s >= -5%, p50 <= +10%)
        run: |
          A=$(ls bench/fargate/out/run.*.json | head -1)
          B=$(ls bench/fargate/out/run.*.json | tail -1)
          nix develop -c go run ./bench/fargate -mode diff -before "$A" -after "$B"
