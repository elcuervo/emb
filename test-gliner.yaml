# GLiNER testbed: scripted (non-embedding) model served via EMB.EVAL / EMB.EVSHA.
# The model binary mounts exactly like any other model; scripts and labels are
# request-time (see openspec change emb-script-eval).
#
# Run:  nix develop
#       ./bin/emb -config test-gliner.yaml -listen :16379
#       just download-gliner-model   (first time only)
listen: :16379

models:
  gliner2:
    onnx: ./models/gliner2/model_int8.onnx
    tokenizer: ./models/gliner2/tokenizer.json
    script_preload: true
    script_workers: 4