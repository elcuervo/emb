AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false

plugins:
  - rubocop-rspec
  - rubocop-rake

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 15

# BatchDispatch is a dispatch facade of many small methods; its pre-existing
# length already exceeded the default 100, and the VALUES-format delegation
# kept it there. ValuesBatch (new) is a separate module that stays well under.
Metrics/ModuleLength:
  Max: 180

Metrics/BlockLength:
  Exclude:
    - spec/**/*

RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/BeforeAfterAll:
  Enabled: false

# The integration suite orchestrates a real Rails boot in subprocesses: its
# describe targets cross-process behavior rather than a loadable class, and its
# probe script exists to emit a JSON fact sheet on stdout.
RSpec/DescribeClass:
  Exclude:
    - spec/integration/**/*

RSpec/Output:
  Exclude:
    - spec/integration/**/*
