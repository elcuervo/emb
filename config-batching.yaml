# Example config demonstrating request-path isolation for inference:
#
#   batching: {timeout, max_batch}  — coalesce concurrent pairs into shared
#               ONNX runs (one session, windowed): fewer threads, better cache
#               reuse, stable throughput under CPU load. See bench/bench.rb
#               stability scenario.
#   intra_op_threads                — leave CPUs for parsing/dispatch so a busy
#               request path does not starve ONNX (and vice versa).
#
# Verify with:  bench-ruby (harness) — the stability gate should PASS here
#               while the default (no batching) config fails it.
listen: ":16379"

models:
  minilm:
    onnx: ./models/minilm/model.onnx
    tokenizer: ./models/minilm/tokenizer.json
    batching:
      timeout: 1
      max_batch: 64
      # max_batch_tokens bounds a window by accumulated real tokens (TEI-style
      # token budget). Unset defaults to 16384; 0 disables token accounting and
      # keeps count-only behavior.
      max_batch_tokens: 16384
    # tokenize_workers dedicates tokenizer goroutines that overlap tokenization
    # with inference. Unset defaults to min(4, cores); 0 = serial.
    tokenize_workers: 4
    # quantize: auto|on|off — auto prefers pre-quantized weights (model_quantized.onnx)
    # when present, else fp32; on requires quantized; off always fp32.
    quantize: auto
    intra_op_threads: 6